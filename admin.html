<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - AM STORE KAWANGKOAN</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            color: #222;
        }
        header {
            background: #f3b9bd;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        header h1 { margin: 0; font-size: 22px; }
        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: 700;
        }
        .btn-primary { background: #222; color: white; }
        .btn-secondary { background: #eee; color: #222; }
        .btn-danger { background: #d9534f; color: white; }
        .btn-small { padding: 7px 10px; font-size: 12px; }
        main { max-width: 1100px; margin: 25px auto; padding: 0 16px; }
        .panel {
            background: white;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }
        h2 { margin-top: 0; }
        .hidden { display: none !important; }
        .login-box { max-width: 430px; margin: 60px auto; }
        label { display: block; margin: 13px 0 6px; font-weight: 700; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font: inherit;
        }
        textarea { min-height: 100px; resize: vertical; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .full { grid-column: 1 / -1; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .message.show { display: block; }
        .message.error { background: #ffe2e2; color: #9b2226; }
        .message.success { background: #def7e5; color: #176b36; }
        .preview {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #f5f5f5;
            display: none;
            margin-top: 10px;
        }
        .product-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .product-card {
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }
        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f2f2f2;
        }
        .product-info { padding: 13px; }
        .product-info h3 { margin: 0 0 7px; font-size: 16px; }
        .price { font-weight: 800; margin-bottom: 5px; }
        .muted { color: #777; font-size: 13px; }
        .card-actions { display: flex; gap: 7px; margin-top: 12px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }
        @media (max-width: 800px) {
            .product-list { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .grid, .product-list { grid-template-columns: 1fr; }
            header { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <h1>AM STORE — ADMIN</h1>
    <div id="headerActions" class="hidden">
        <button class="btn-secondary" onclick="window.location.href='/'">Lihat Toko</button>
        <button class="btn-danger" onclick="logout()">Keluar</button>
    </div>
</header>

<main>
    <section id="loginSection" class="panel login-box">
        <h2>Login Admin</h2>
        <p class="muted">Gunakan email dan password admin Supabase.</p>
        <div id="loginMessage" class="message"></div>

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="admin@email.com">

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password">

        <div class="actions">
            <button class="btn-primary" onclick="login()">Login</button>
        </div>
    </section>

    <section id="adminSection" class="hidden">
        <div id="adminMessage" class="message"></div>

        <div class="panel">
            <div class="topbar">
                <div>
                    <h2 id="formTitle">Tambah Produk</h2>
                    <p class="muted">Upload foto dan isi informasi produk.</p>
                </div>
            </div>

            <input type="hidden" id="productId">

            <div class="grid">
                <div>
                    <label for="productName">Nama Produk *</label>
                    <input id="productName" type="text" placeholder="Contoh: Rok Plisket Pink">
                </div>

                <div>
                    <label for="categoryId">Kategori *</label>
                    <select id="categoryId">
                        <option value="">Memuat kategori...</option>
                    </select>
                </div>

                <div>
                    <label for="price">Harga *</label>
                    <input id="price" type="text" inputmode="numeric" placeholder="150.000" autocomplete="off" oninput="formatPriceInput(this)">
                </div>

                <div>
                    <label for="stock">Stok *</label>
                    <input id="stock" type="number" min="0" step="1" placeholder="10">
                </div>

                <div>
                    <label for="sku">SKU</label>
                    <input id="sku" type="text" placeholder="AM-001">
                </div>

                <div>
                    <label for="photo">Foto Produk</label>
                    <input id="photo" type="file" accept="image/*" onchange="previewPhoto(event)">
                    <img id="photoPreview" class="preview" alt="Preview foto">
                </div>

                <div class="full">
                    <label for="description">Deskripsi</label>
                    <textarea id="description" placeholder="Deskripsi produk..."></textarea>
                </div>

                <div>
                    <label>
                        <input id="isFeatured" type="checkbox" style="width:auto; margin-right:7px;">
                        Produk unggulan
                    </label>
                </div>

                <div>
                    <label>
                        <input id="isActive" type="checkbox" checked style="width:auto; margin-right:7px;">
                        Produk aktif / tampil di toko
                    </label>
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" onclick="saveProduct()">Simpan Produk</button>
                <button class="btn-secondary" onclick="resetForm()">Batal / Bersihkan</button>
            </div>
        </div>

        <div class="panel">
            <div class="topbar">
                <div>
                    <h2>Daftar Produk</h2>
                    <p class="muted">Kelola produk yang tampil di toko.</p>
                </div>
                <button class="btn-secondary" onclick="loadProducts()">Refresh</button>
            </div>
            <div id="productList" class="product-list">
                Memuat produk...
            </div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
    const SUPABASE_URL = "https://pdivyoimgivysucthumk.supabase.co/";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkaXZ5b2ltZ2l2eXN1Y3RodW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NDEzODgsImV4cCI6MjEwNzAxNzM4OH0.upaZOW3SlxEjYodwdwenUqeRw0RpTr9_3ZoKOm4Mqhk";

    if (
        !SUPABASE_URL ||
        SUPABASE_URL.includes("GANTI_DENGAN") ||
        !SUPABASE_ANON_KEY ||
        SUPABASE_ANON_KEY.includes("GANTI_DENGAN")
    ) {
        console.error("Isi SUPABASE_URL dan SUPABASE_ANON_KEY terlebih dahulu.");
    }

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    let currentProducts = [];

    function showMessage(id, text, type) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = "message show " + type;
    }

    function hideMessage(id) {
        const el = document.getElementById(id);
        el.className = "message";
        el.textContent = "";
    }

    function formatRupiah(value) {
        return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }).format(value || 0);
    }

    function formatPriceInput(input) {
        const digits = input.value.replace(/\\D/g, "");
        input.value = digits
            ? new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 }).format(Number(digits))
            : "";
    }

    function parsePrice(value) {
        const digits = String(value || "").replace(/\\D/g, "");
        return digits ? Number(digits) : 0;
    }

    function makeSlug(text) {
        return text
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9\s-]/g, "")
            .replace(/\s+/g, "-")
            .replace(/-+/g, "-");
    }

    async function login() {
        hideMessage("loginMessage");

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            showMessage("loginMessage", "Email dan password wajib diisi.", "error");
            return;
        }

        const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            console.error(error);
            showMessage("loginMessage", "Login gagal: " + error.message, "error");
            return;
        }

        await showAdmin();
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        document.getElementById("adminSection").classList.add("hidden");
        document.getElementById("headerActions").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
    }

    async function showAdmin() {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("adminSection").classList.remove("hidden");
        document.getElementById("headerActions").classList.remove("hidden");

        await loadCategories();
        await loadProducts();
    }

    async function loadCategories() {
        const { data, error } = await supabaseClient
            .from("categories")
            .select("id, name")
            .eq("is_active", true)
            .order("name");

        if (error) {
            console.error(error);
            showMessage("adminMessage", "Kategori gagal dimuat: " + error.message, "error");
            return;
        }

        const select = document.getElementById("categoryId");
        select.innerHTML = '<option value="">Pilih kategori</option>';

        data.forEach(category => {
            const option = document.createElement("option");
            option.value = category.id;
            option.textContent = category.name;
            select.appendChild(option);
        });
    }

    async function uploadPhoto(file) {
        if (!file) return null;

        const extension = file.name.split(".").pop().toLowerCase();
        const safeExtension = ["jpg", "jpeg", "png", "webp", "gif"].includes(extension)
            ? extension
            : "jpg";

        const fileName = "produk-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + safeExtension;

        const { error } = await supabaseClient.storage
            .from("product-images")
            .upload(fileName, file, {
                cacheControl: "3600",
                upsert: false
            });

        if (error) {
            throw error;
        }

        const { data } = supabaseClient.storage
            .from("product-images")
            .getPublicUrl(fileName);

        return data.publicUrl;
    }

    function previewPhoto(event) {
        const file = event.target.files[0];
        const preview = document.getElementById("photoPreview");

        if (!file) {
            preview.style.display = "none";
            preview.removeAttribute("src");
            return;
        }

        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }

    async function saveProduct() {
        hideMessage("adminMessage");

        const productId = document.getElementById("productId").value;
        const name = document.getElementById("productName").value.trim();
        const categoryId = document.getElementById("categoryId").value;
        const price = parsePrice(document.getElementById("price").value);
        const stock = Number(document.getElementById("stock").value);
        const sku = document.getElementById("sku").value.trim() || null;
        const description = document.getElementById("description").value.trim() || null;
        const isFeatured = document.getElementById("isFeatured").checked;
        const isActive = document.getElementById("isActive").checked;
        const file = document.getElementById("photo").files[0];

        if (!name || !categoryId || Number.isNaN(price) || Number.isNaN(stock)) {
            showMessage("adminMessage", "Nama, kategori, harga, dan stok wajib diisi.", "error");
            return;
        }

        const saveButton = document.querySelector('button[onclick="saveProduct()"]');
        saveButton.disabled = true;
        saveButton.textContent = "Menyimpan...";

        try {
            let imageUrl = null;

            if (file) {
                imageUrl = await uploadPhoto(file);
            }

            const payload = {
                name,
                slug: makeSlug(name),
                category_id: categoryId,
                price,
                stock,
                sku,
                description,
                is_featured: isFeatured,
                is_active: isActive
            };

            if (imageUrl) {
                payload.image_url = imageUrl;
            }

            let result;

            if (productId) {
                result = await supabaseClient
                    .from("products")
                    .update(payload)
                    .eq("id", productId);
            } else {
                result = await supabaseClient
                    .from("products")
                    .insert(payload);
            }

            if (result.error) throw result.error;

            showMessage(
                "adminMessage",
                productId ? "Produk berhasil diperbarui." : "Produk berhasil ditambahkan.",
                "success"
            );

            resetForm();
            await loadProducts();

        } catch (error) {
            console.error(error);
            showMessage("adminMessage", "Gagal menyimpan: " + (error.message || error), "error");
        } finally {
            saveButton.disabled = false;
            saveButton.textContent = "Simpan Produk";
        }
    }

    async function loadProducts() {
        const container = document.getElementById("productList");
        container.innerHTML = "Memuat produk...";

        const { data, error } = await supabaseClient
            .from("products")
            .select(`
                id,
                name,
                slug,
                description,
                price,
                stock,
                sku,
                image_url,
                is_active,
                is_featured,
                category_id,
                categories (name)
            `)
            .order("created_at", { ascending: false });

        if (error) {
            console.error(error);
            container.innerHTML = "<p>Gagal memuat produk: " + error.message + "</p>";
            return;
        }

        currentProducts = data || [];

        if (!currentProducts.length) {
            container.innerHTML = "<p>Belum ada produk.</p>";
            return;
        }

        container.innerHTML = currentProducts.map(product => {
            const image = product.image_url
                ? `<img src="${escapeHtml(product.image_url)}" alt="${escapeHtml(product.name)}">`
                : `<div style="height:220px;display:flex;align-items:center;justify-content:center;background:#f2f2f2;color:#888;">Belum ada foto</div>`;

            return `
                <article class="product-card">
                    ${image}
                    <div class="product-info">
                        <h3>${escapeHtml(product.name)}</h3>
                        <div class="price">${formatRupiah(product.price)}</div>
                        <div class="muted">Stok: ${product.stock} · ${escapeHtml(product.categories?.name || "-")}</div>
                        <div class="muted">${product.is_active ? "Aktif" : "Nonaktif"}${product.is_featured ? " · Unggulan" : ""}</div>
                        <div class="card-actions">
                            <button class="btn-primary btn-small" onclick="editProduct('${product.id}')">Edit</button>
                            <button class="btn-danger btn-small" onclick="deleteProduct('${product.id}')">Hapus</button>
                        </div>
                    </div>
                </article>
            `;
        }).join("");
    }

    function editProduct(id) {
        const product = currentProducts.find(item => item.id === id);
        if (!product) return;

        document.getElementById("productId").value = product.id;
        document.getElementById("productName").value = product.name || "";
        document.getElementById("categoryId").value = product.category_id || "";
        document.getElementById("price").value = product.price ? new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 }).format(product.price) : "";
        document.getElementById("stock").value = product.stock || 0;
        document.getElementById("sku").value = product.sku || "";
        document.getElementById("description").value = product.description || "";
        document.getElementById("isFeatured").checked = !!product.is_featured;
        document.getElementById("isActive").checked = !!product.is_active;

        const preview = document.getElementById("photoPreview");
        if (product.image_url) {
            preview.src = product.image_url;
            preview.style.display = "block";
        } else {
            preview.style.display = "none";
        }

        document.getElementById("formTitle").textContent = "Edit Produk";
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteProduct(id) {
        const product = currentProducts.find(item => item.id === id);
        if (!product) return;

        if (!confirm("Hapus produk '" + product.name + "'?")) return;

        const { error } = await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);

        if (error) {
            console.error(error);
            showMessage("adminMessage", "Gagal menghapus: " + error.message, "error");
            return;
        }

        showMessage("adminMessage", "Produk berhasil dihapus.", "success");
        await loadProducts();
    }

    function resetForm() {
        document.getElementById("productId").value = "";
        document.getElementById("productName").value = "";
        document.getElementById("categoryId").value = "";
        document.getElementById("price").value = "";
        document.getElementById("stock").value = "";
        document.getElementById("sku").value = "";
        document.getElementById("description").value = "";
        document.getElementById("isFeatured").checked = false;
        document.getElementById("isActive").checked = true;
        document.getElementById("photo").value = "";

        const preview = document.getElementById("photoPreview");
        preview.style.display = "none";
        preview.removeAttribute("src");

        document.getElementById("formTitle").textContent = "Tambah Produk";
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function init() {
        const { data } = await supabaseClient.auth.getSession();

        if (data.session) {
            await showAdmin();
        }
    }

    init();
</script>
</body>
</html>
